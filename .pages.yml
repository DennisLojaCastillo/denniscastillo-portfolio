media:
  input: public/uploads
  output: /uploads

content:
  - name: cases
    label: Cases
    type: collection
    path: src/content/cases
    filename: "{fields.title}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      fields: [title, client, year]
      primary: title
      sort: [order, year, title]
      order: asc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: client, label: Kunde, type: string }
      - { name: year, label: År, type: number }
      - { name: order, label: Rækkefølge, type: number, description: "Lavest tal vises først" }
      - { name: services, label: Ydelser, type: string, list: true }
      - { name: excerpt, label: Uddrag, type: text }
      - { name: cover, label: Cover, type: image }
      - { name: gallery, label: Galleri, type: image, list: true }
      - { name: url, label: Live-link, type: string }
      - { name: draft, label: Kladde, type: boolean }
      - { name: body, label: Indhold, type: rich-text }

  - name: services
    label: Services
    type: collection
    path: src/content/services
    filename: "{fields.title}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      fields: [title, order]
      primary: title
      sort: [order, title]
      order: asc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: order, label: Rækkefølge, type: number, description: "Lavest tal vises først" }
      - { name: excerpt, label: Kort tekst, type: text, description: "Vises i oversigten og under overskriften" }
      - { name: introHeading, label: Intro, overskrift, type: string }
      - { name: intro, label: Intro, afsnit, type: text, list: true }
      - name: offerings
        label: Hvad jeg tilbyder
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: items, label: Punkter, type: string, list: true }
      - { name: included, label: "Hvad får du med, afsnit", type: text, list: true }
      - { name: features, label: "Hvad får du med, fordele", type: string, list: true }
      - name: process
        label: Udviklingsprocessen
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Tekst, type: text }
      - { name: draft, label: Kladde, type: boolean }

  - name: services-side
    label: Services-oversigt
    type: file
    path: src/content/pages/services.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: SEO-beskrivelse, type: text }
      - { name: eyebrow, label: Lille linje over overskriften, type: string }
      - { name: heroTitle, label: Overskrift, type: string }
      - { name: introHeading, label: Intro, overskrift, type: string }
      - { name: introText, label: Intro, tekst, type: text }
      - { name: processHeading, label: Proces, overskrift, type: string }
      - { name: processText, label: Proces, tekst, type: text }
      - name: process
        label: Proces, trin
        type: object
        list:
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Tekst, type: text }
      - { name: contactHeading, label: "Kontaktboks på undersider, overskrift", type: string }
      - { name: contactText, label: "Kontaktboks på undersider, tekst", type: text }
      - { name: ctaLabel, label: Knaptekst, type: string }

  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{fields.title}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      order: desc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: date, label: Dato, type: date, required: true }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: excerpt, label: Uddrag, type: text }
      - { name: cover, label: Cover, type: image }
      - { name: draft, label: Kladde, type: boolean }
      - { name: body, label: Indhold, type: rich-text }

  - name: forside
    label: Forside
    type: file
    path: src/content/pages/forside.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: SEO-beskrivelse, type: text }
      - { name: heroTitle, label: Hero-overskrift, type: string, description: "Den store serif-overskrift øverst" }
      - { name: heroText, label: Hero-tekst, type: text }
      - { name: availability, label: Ledig-mærke, type: string, description: "Fx 'Ledig fra oktober'. Lad stå tom for at skjule mærket" }
      - { name: portrait, label: Portræt, type: image }
      - { name: portraitAlt, label: Alt-tekst til portræt, type: string }
      - name: services
        label: Hvad jeg laver
        type: object
        list:
          min: 2
          max: 4
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Tekst, type: text }
      - { name: processHeading, label: Proces, overskrift, type: string }
      - name: process
        label: Proces, trin
        type: object
        list:
          min: 2
          max: 5
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Tekst, type: text }
      - name: frame
        label: Ramme (pris, tid, kontakt)
        type: object
        list:
          max: 3
          collapsible:
            summary: "{fields.title}"
        fields:
          - { name: title, label: Titel, type: string }
          - { name: text, label: Tekst, type: text }
      - { name: aboutLead, label: Om, hovedsætning, type: text }
      - { name: aboutText, label: Om, afsnit, type: text, list: true }
      - { name: contactHeading, label: Kontakt-overskrift, type: string }

  - name: om
    label: Om
    type: file
    path: src/content/pages/om.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: SEO-beskrivelse, type: text }
      - { name: body, label: Indhold, type: rich-text }

  - name: kontakt
    label: Kontakt
    type: file
    path: src/content/pages/kontakt.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: SEO-beskrivelse, type: text }
      - { name: body, label: Indhold, type: rich-text }

  - name: settings
    label: Opsætning
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: siteName, label: Sitenavn, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: seoTitle, label: SEO-titel, type: string }
      - { name: seoDescription, label: SEO-beskrivelse, type: text }
      - { name: email, label: Kontakt-email, type: string }
      - name: nav
        label: Navigation
        type: object
        list:
          collapsible:
            summary: "{fields.label}"
        fields:
          - { name: label, label: Tekst, type: string }
          - { name: url, label: Link, type: string }
      - name: social
        label: Sociale links
        type: object
        list:
          collapsible:
            summary: "{fields.label}"
        fields:
          - { name: label, label: Tekst, type: string }
          - { name: url, label: Link, type: string }
      - { name: footerText, label: Footer-tekst, type: string }
